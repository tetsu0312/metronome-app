<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Metronome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="header">
    <h1>メトロノーム</h1>
  </div>

  <div class="main">
    <div class="bpm-area">
      <span id="bpm">100</span>
      <span class="unit">BPM</span>
    </div>

    <button class="play-btn" id="playBtn">▶</button>

    <div class="control">
      <div class="minus" id="minus">−</div>

      <input type="range" id="slider" min="60" max="200" value="100">

      <div class="plus" id="plus">＋</div>
    </div>
  </div>
</div>

<div class="sound-panel">
  <p>サウンド</p>
  <div class="sound-buttons">
    <button class="sound active">クリック</button>
    <button class="sound">ビープ</button>
    <button class="sound">ウッド</button>
    <button class="sound">デジタル</button>
    <button class="sound">ミックス</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
